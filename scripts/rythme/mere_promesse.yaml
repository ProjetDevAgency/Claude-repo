# BROUILLON en attente de validation — Mode respiration — même vidéo que le pilote (points rouges = bleu sous la corne)
video: library/raw/7393446236759674142.mp4
title: "Ma mère est morte en me faisant promettre de garder sa dernière vache ..."
duration: 62.0
segments:
  - t: 0.0
    text: "Ma mère est morte en me faisant promettre une seule chose. Garder sa dernière vache."
  - t: 4.8
    text: "Elle s'appelle Noisette, quatorze ans, la plus vieille de l'étable. C'est ma mère qui l'a fait naître. Trois mois après l'enterrement, Noisette boite de l'arrière. Mon frère me fait, vends-la, elle vaut plu rien."
  - t: 17.0   # le couteau gratte la sole (16 → 26 s)
    text: "Je gratte la sole de Noisette, une fine couche à la fois. Elle bouge pas. Elle se laisse faire."
  - t: 26.0   # gros plan sur les points rouges (26 → 34 s)
    text: "Et là, des points rouges. Du sang sous la corne. Noisette est pas malade, elle a un bleu. Mais alors d'où il vient ? Depuis l'enterrement, elle reste debout devant la barrière, toute la journée, sur le béton. Elle attend ma mère."
  - t: 42.5   # on soulage autour (40 → 56 s)
    text: "Un bleu, je creuse pas. Je soulage autour, pour que son poids passe sur la partie saine."
  - t: 50.5
    text: "Le soir, je pose un tapis de caoutchouc devant la barrière. Le lendemain, Noisette marche droit. Mon frère dit plu rien. Elle attend toujours ma mère. Mais elle a plu mal."
