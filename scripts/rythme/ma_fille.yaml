# BROUILLON en attente de validation — écrit dans la trame output/trames/7621673039805123870.md
video: library/raw/7621673039805123870.mp4
title: "Ma fille de 8 ans a sauvé une vache condamnée par 3 adultes ..."
duration: 62.0
segments:
  - t: 0.2    # PAROLE 0.2 → 7.9 (~119 car.) — gros plan sur les points
    text: "Ma fille de huit ans a sauvé une vache que trois adultes avaient condamnée. Elle partait à l'abattoir vendredi."
  - t: 14.5   # PAROLE 14.5 → 22.2 (~119 car.) — le couteau travaille près des points
    text: "C'est elle qui me tire la manche. Des petits points, serrés sur la sole. Le vieux rigole et il me fait, c'est rien, ça."
  - t: 26.6   # PAROLE 26.6 → 36.8 (~158 car.) — on retire la corne autour des points
    text: "Sauf que des points serrés comme ça, dessous, ça souffre depuis longtemps. J'enlève de la corne pour retirer du poids, et je cherche une poche."
  - t: 43.8   # PAROLE 43.8 → 62 (~282 car.) — l'encoche vers l'extérieur
    text: "Pas de poche. Une semaine de plus, et elle était là. Je descends sans aller trop profond, et je taille une petite sortie vers l'extérieur, pour que la saleté s'en aille. L'éleveur regarde ma fille, longtemps. Il annule le camion. Elle a eu dix euros. Ils sont scotchés dans mon camion."
