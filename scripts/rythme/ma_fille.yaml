  - t: 0.0    # couteau en action dès la première image
    text: "J'ai soigné une vache en cachette, contre l'avis de son propriétaire. Elle partait à l'abattoir le lendemain."
  - t: 7.6    # PAROLE 6.5 → 14.2
    text: "Ma fille de huit ans avait vu les points. Le vieux m'a fait, touche pas, elle part demain. Puis il est allé chercher le café."
  - t: 18.6   # PAROLE 18.6 → 28.8
    text: "Dix minutes. Des points serrés comme ça, dessous, ça souffre depuis longtemps. J'enlève de la corne pour retirer du poids, et je cherche une poche."
  - t: 35.8   # PAROLE 35.8 → 53 — l'encoche vers l'extérieur
    text: "Pas de poche. Je descends sans aller trop profond, et je taille une petite sortie vers l'extérieur, pour que la saleté s'en aille. Le lendemain, la vache marche droit devant le chauffeur du camion."
  - t: 53.0
    text: "Le vieux a annulé. Il m'a plu jamais rappelé. Ma fille, elle, a eu dix euros."
