# ─────────────────────────────────────────────────────────────
#  Configuration de la machine à vidéos
# ─────────────────────────────────────────────────────────────

download:
  account_url: "https://www.tiktok.com/@natethehoofguy"
  min_duration: 60          # on ne garde que les vidéos > 60 s

script:
  # Génération auto via l'API Claude (nécessite ANTHROPIC_API_KEY).
  # Sinon, écris/colle ton script dans scripts/<nom>.txt
  model: "claude-opus-5-5"
  niche: "maréchal-ferrant, parage et soin des sabots de chevaux"
  audience: "public mixte, 25 à 44 ans"
  voice_type: "Une voix IA d'homme"

voice:
  # "tts" = voix générée, "file" = ton propre fichier audio (--voice-file)
  mode: "tts"
  # "edge" = voix Microsoft gratuite, "elevenlabs" = ta voix ElevenLabs
  # (la clé se met dans la variable d'environnement ELEVENLABS_API_KEY, jamais ici)
  provider: "edge"
  elevenlabs:
    voice_id: ""                # vide = lu dans ELEVENLABS_VOICE_ID
    model: "eleven_multilingual_v2"
  tts_voice: "fr-FR-RemyMultilingualNeural"   # alternatives : fr-FR-HenriNeural, fr-FR-VivienneMultilingualNeural
  tts_rate: "+0%"
  # Suppression des silences
  silence_threshold_db: -38     # en dessous = silence
  min_silence: 0.15             # silences plus longs que ça sont raccourcis…
  keep_silence: 0.09            # …à cette durée (respiration naturelle)
  max_speedup: 1.35             # accélération maximale autorisée
  min_speed: 0.94               # ralentissement maximal si la voix est trop courte

edit:
  target_min: 61.0
  target_max: 63.0
  width: 1080
  height: 1920
  fps: 30
  mirror: true
  # Étalonnage (ffmpeg eq + colorbalance)
  color:
    contrast: 1.10
    saturation: 1.22
    brightness: 0.02
    gamma: 0.97
    warm: 0.05                  # >0 = plus chaud, <0 = plus froid
    vignette: true
  zoom: 1.04                    # léger zoom (recadre les bords)
  original_audio_volume: 0.0    # 0 = muet, 0.08 = ambiance discrète
  music_volume: 0.06            # si un fichier est dans assets/music/
  skip_start: 0.0               # secondes à sauter au début de la vidéo source

subtitles:
  font_file: "assets/fonts/Montserrat-ExtraBold.ttf"
  font_name: "Montserrat ExtraBold"
  size: 92
  uppercase: true
  position_y: 0.62              # 0.5 = centre exact, 0.8 = comme le modèle
  outline: 7
  shadow: 2
  color: "&H00FFFFFF"           # blanc (format ASS &HAABBGGRR)
  highlight_color: "&H0000E5FF" # jaune pour les montants / chiffres

title:
  enabled: true                 # bandeau blanc en haut (comme le modèle)
  duration: 5.5
  font_size: 50
  position_y: 0.07
