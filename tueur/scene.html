// découpage des sous-titres : 2 à 3 mots, coupe aux fins de phrase
function chunks(line) {
  const out = []; let cur = [];
  line.words.forEach((w, i) => {
    cur.push(w);
    const end = /[.?!]$/.test(w.w), comma = /,$/.test(w.w);
    if (cur.length >= 3 || end || (comma && cur.length >= 2) || i === line.words.length - 1) { out.push(cur); cur = []; }
  });
  // fusionne un mot seul avec le morceau d'avant si possible
  for (let i = out.length - 1; i > 0; i--) if (out[i].length === 1 && out[i - 1].length === 1 && !/[.?!]$/.test(out[i - 1][0].w)) { out[i - 1].push(...out[i]); out.splice(i, 1); }
  return out.map((ws, k) => {
    let red = ws.findIndex(w => TL.rouge.includes(norm(w.w)));
    if (red < 0) { let best = -1, len = 4; ws.forEach((w, j) => { const n = norm(w.w); if (!STOP.has(n) && n.length > len) { len = n.length; best = j; } }); red = best; }
    return { ws, red, s: ws[0].s };
  });
}

window.setup = (timeline) => {
  TL = timeline;
  TL.lines.forEach(l => l.chunks = chunks(l));
  TL.plans.forEach((p, i) => p.end = i + 1 < TL.plans.length ? TL.plans[i + 1].start : TL.duration + 1);
  ui("epi").textContent = TL.hud.episode; ui("place").textContent = TL.hud.lieu; ui("handle").textContent = TL.hud.compte || "";
  ui("rulek").textContent = TL.regle.titre; ui("rulet").textContent = TL.regle.texte;
  const tx = TL.texto, n = lineN(TL.lines.findIndex(l => TL.speakers[l.speaker] && TL.speakers[l.speaker].texto) + 1);
  ui("smsde").textContent = tx.de;
  ui("smsts1").textContent = tx.avant_label || ("Hier, " + tx.avant_heure); ui("smsts2").textContent = tx.label || ("Aujourd'hui, " + tx.heure);
  ui("smsold").innerHTML = tx.avant + (tx.coeur === false ? "" : ' <span class="hrt" id="hrt">❤</span>');
  ui("smsnew").textContent = n.text;

function clock(t) {
  const [h, m, s] = TL.hud.heure.split(":").map(Number);
  const tot = h * 3600 + m * 60 + s + Math.floor(t);
  const p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(tot / 3600))}:${p(Math.floor(tot / 60) % 60)}:${p(tot % 60)}`;
}

function heroAt(t) {
  const A = new THREE.Vector3(0.7, 0, -0.1), B = new THREE.Vector3(1.25, 0, -2.3), C = new THREE.Vector3(0.8, 0, -1.85);
  const w0 = M("marche"), w1 = w0 + 1.7, b0 = M("pieds") - 0.4, b1 = b0 + 0.7;
  const k1 = ease(ramp(t, w0, w1)), k2 = ease(ramp(t, b0, b1));
  hero.position.lerpVectors(A, B, k1).lerp(C, k2);
  const faceDoor = Math.atan2(1.4 - A.x, -3 - A.z);
  let rot = lerp(faceDoor, Math.PI, ease(ramp(t, w0, w0 + 0.6)));
  rot = lerp(rot, 2 * Math.PI - 0.12, ease(ramp(t, M("retour"), M("retour") + 1.0)));
  hero.rotation.y = rot;
  const walking = (t > w0 && t < w1 ? Math.sin(Math.PI * ramp(t, w0, w1)) ** .4 : 0) + (t > b0 && t < b1 ? Math.sin(Math.PI * ramp(t, b0, b1)) * 0.6 : 0);
  pose(hero, t * 10, walking);
  hero.position.y = walking * Math.abs(Math.sin(t * 10)) * 0.03;
  hero.userData.head.rotation.x = 0.35 * ease(ramp(t, M("pieds"), M("pieds") + 0.6)) - 0.35 * ease(ramp(t, M("pieds") + 4, M("pieds") + 4.6));
}

function worldP1(t, ev, creak) {
  // la lumière sous la porte, et les deux pieds immobiles
  drawGap(0, 0);
  // le répit : les pieds s'en vont, puis la lumière du couloir s'éteint
  const rp = TL.marques.repit ?? 1e9, part = ease(ramp(t, rp, rp + 1.0)), noir = ease(ramp(t, rp + 1.4, rp + 1.8));
  feet.forEach((f, i) => { f.position.x = 1.4 + (i ? 0.13 : -0.13) + 0.9 * part; f.material.opacity = (0.45 + 0.47 * ramp(t, M("pieds"), M("pieds") + 0.5)) * (1 - part);
    f.visible = f.position.x < 1.95; });
  gapLight.intensity = 0.6 * (1 - noir); gap.material.opacity = 1 - noir; gapLine.material.opacity = 1 - noir; gapLine.material.transparent = true;

  // téléphone
  const b0 = (ev.buzz || [1e9])[0];
  const buzzing = (ev.buzz || []).some(b => t > b && t < b + 1.1);
  phone.position.x = 0.55 + (buzzing ? Math.sin(t * 160) * 0.004 : 0);
  phone.rotation.y = buzzing ? Math.sin(t * 120) * 0.04 : 0;
  drawPhone(t > b0 ? 1 : 0, clamp(ramp(t, b0, b0 + 0.3)));
  phoneLight.intensity = t > b0 ? 0.35 : 0;

  // le frère disparaît au grincement, la lumière de la salle de bain s'allume
  brotherBed.visible = t < creak;
  blanket.position.set(...(t < creak ? [0.56, 0.57, 2.15] : [0.75, 0.47, 1.95])); blanket.rotation.y = t < creak ? 0 : 0.6;
  bathGlow.visible = t >= creak; bathLight.intensity = t >= creak ? 0.3 : 0;

  // couloir : lampe qui grésille
  hallLamp.intensity = 6 * (Math.sin(t * 37) > 0.93 ? 0.25 : 1);
  bulb.material.color.setScalar(hallLamp.intensity > 3 ? 1 : 0.35);

  heroAt(t);

}

function heroP2(t) {
  const A = new THREE.Vector3(0.8, 0, -1.85), B = new THREE.Vector3(-2.2, 0, 1.95), C = new THREE.Vector3(-3.45, 0, 1.4), D = new THREE.Vector3(-3.75, 0, 2.15);
  const tr = M("traverse"), en = (TL.events.creak || [1e9])[0], rp = M("repit");
  const k1 = ease(ramp(t, tr, tr + 2.4)), k2 = ease(ramp(t, en + 0.4, en + 1.4));
  hero.position.lerpVectors(A, B, k1).lerp(C, k2);
  if (t >= rp) hero.position.copy(D);
  let rot = lerp(Math.PI, Math.atan2(B.x - A.x, B.z - A.z), ease(ramp(t, tr, tr + 0.4)));
  rot = lerp(rot, -Math.PI / 2, ease(ramp(t, tr + 2.2, tr + 2.6)));
  hero.rotation.y = rot;
  const walking = (t > tr && t < tr + 2.4 ? Math.sin(Math.PI * ramp(t, tr, tr + 2.4)) ** .4 : 0) + (t > en + 0.4 && t < en + 1.4 ? 0.7 : 0);
  pose(hero, t * 10, walking); hero.position.y = walking * Math.abs(Math.sin(t * 10)) * 0.03;
  hero.userData.head.rotation.x = 0;
}

function worldP2(t, ev, pl) {
  const creak = (ev.creak || [1e9])[0], rid = (ev.rideau || [1e9])[0], vr = M("verrou");
  // le salon : la lumière et les pieds sous la porte d'entrée, le canapé vide, le téléphone dans ta main
  drawGap(0, 0);
  feet.forEach((f, i) => { f.position.x = 1.4 + (i ? 0.13 : -0.13); f.material.opacity = 0.9; f.visible = true; });
  gapLight.intensity = 0.6; gap.material.opacity = 1; gapLine.material.opacity = 1;
  brotherBed.visible = false; blanket.position.set(0.75, 0.47, 1.95); blanket.rotation.y = 0.6;
  phone.visible = false; phoneLight.intensity = 0;
  // la porte de la salle de bain : elle s'ouvre au grincement, tu la refermes avant le verrou
  bathDoorPivot.rotation.y = 1.3 * ease(ramp(t, creak, creak + 0.9)) * (1 - ease(ramp(t, vr - 0.9, vr - 0.1)));
  verrouKnob.rotation.x = (Math.PI / 2) * ease(ramp(t, vr + 0.6, vr + 1.0));
  bathGlow.visible = t < creak + 0.4; bathLight.intensity = t < creak + 0.4 ? 0.3 : 0;
  sdb.visible = !["porte", "canape_vide", "traverse", "porte_proche"].includes(pl.name);
  ceil.visible = sdbLamp.visible = pl.name !== "sdb_final";  // vue maquette : on enlève le plafond et sa lampe
  // le rideau bouge au bruit ; la silhouette apparaît au miroir, les pieds juste après
  waveCurtain(t, (t >= rid ? 0.07 * Math.exp(-(t - rid) * 1.1) : 0) + 0.004);
  ombre.visible = t >= M("miroir"); backLight.intensity = t >= M("miroir") ? 0.9 : 0;
  piedsNus.visible = t >= M("pieds") - 0.2;
  heroP2(t);
}

const v3 = new THREE.Vector3();
function toScreen(p, cam) { v3.set(...p).project(cam); return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H]; }

window.renderAt = (t) => {
  const ev = TL.events, creak = (ev.creak || [1e9])[0], sting = (ev.sting || [1e9])[0], choix = M("choix");

  // porte qui tremble aux coups
  let knock = 0;
  for (const k of ev.knock || []) for (let j = 0; j < 3; j++) { const kk = k + j * 0.3; if (t >= kk) knock += Math.exp(-(t - kk) * 18); }
  doorPivot.rotation.y = -0.012 * knock * Math.sin(t * 90);

  const pl = TL.plans.find(p => t >= p.start && t < p.end) || TL.plans[TL.plans.length - 1];
  if (TL.scene === "mon_loup_p2") worldP2(t, ev, pl); else worldP1(t, ev, creak);

  // caméra
  let cam = camera;
  if (pl.name === "judas") {
    hall.visible = true; door.visible = false; hero.visible = false;
    peepCam.position.set(1.4 + Math.sin(t * 2) * 0.03, 1.6, BZ - 0.13);
    peepCam.lookAt(1.4 + Math.sin(t * 0.9) * 0.35, 1.2, -5.5);
    cam = peepCam;
  } else {
    hall.visible = false; door.visible = true; hero.visible = true;
    const P = PRESETS[pl.name], k = ease(ramp(t, pl.start, pl.end));
    camera.fov = P[4]; camera.updateProjectionMatrix();
    camera.position.set(...P[0].map((v, i) => lerp(v, P[1][i], k)));
    const shake = knock * 0.025 + (t > creak ? 0.012 * Math.exp(-(t - creak) * 1.5) : 0);
    camera.position.x += Math.sin(t * 71) * shake; camera.position.y += Math.cos(t * 63) * shake;
    camera.lookAt(...P[2].map((v, i) => lerp(v, P[3][i], k)));
  }
  ui("peep").style.opacity = pl.name === "judas" ? 1 : 0;

  const ch = ramp(t, choix - 0.1, choix + 0.5);
  renderer.toneMappingExposure = 1.25 - 0.4 * ch;
  outline.render(scene, cam);

  // HUD
  ui("clock").textContent = clock(t);
  if (TL.hud.lieux) { let lieu = TL.hud.lieu; for (const [n, l] of TL.hud.lieux) if (t >= TL.lines[n - 1].start) lieu = l; ui("place").textContent = lieu; }

  // carton de règle
  const R = TL.regle, ra = ramp(t, R.start - 0.1, R.start + 0.2) * (1 - ramp(t, R.end + 0.5, R.end + 0.8));
  ui("rule").style.opacity = ra; ui("rule").style.transform = `scale(${0.9 + 0.1 * ease(ramp(t, R.start - 0.1, R.start + 0.25))})`;

  // texto
  const txi = TL.lines.findIndex(l => TL.speakers[l.speaker] && TL.speakers[l.speaker].texto), tl = TL.lines[txi];
  const txEnd = TL.texto.fin_ligne ? TL.lines[TL.texto.fin_ligne - 1].end : TL.lines[txi + 2].end;
  const sOn = ramp(t, tl.start - 0.4, tl.start - 0.1) * (1 - ramp(t, txEnd + 0.2, txEnd + 0.5));
  ui("sms").style.opacity = sOn; ui("sms").style.transform = `translateY(${(1 - ease(ramp(t, tl.start - 0.4, tl.start))) * 40}px)`;
  ui("smsnew").parentElement.style.opacity = ramp(t, tl.start, tl.start + 0.2);
  const hl1 = TL.lines[txi + 1], hl2 = TL.lines[txi + 2], entourer = TL.texto.entourer !== false;
  const heartOn = entourer && t > hl1.start + (hl1.end - hl1.start) * 0.55 && t < hl2.start;
  if (ui("hrt")) ui("hrt").style.transform = `scale(${heartOn ? 1.6 + 0.15 * Math.sin(t * 14) : 1})`;
  const ring = ui("ring");
  const target = t >= hl2.start ? ui("smsnew") : ui("hrt");
  if (entourer && (heartOn || t >= hl2.start)) {
    const box = target.getBoundingClientRect(), pbox = ui("sms").getBoundingClientRect();
    const pad = t >= hl2.start ? 0 : 14;
    Object.assign(ring.style, { left: `${box.right - pbox.left - (t >= hl2.start ? 90 : box.width) - pad}px`, top: `${box.top - pbox.top - pad}px`,
      width: `${(t >= hl2.start ? 90 : box.width) + 2 * pad}px`, height: `${box.height + 2 * pad}px`, opacity: 1 });
  } else ring.style.opacity = 0;

  // sous-titres mot à mot
  const cap = ui("cap");
  const cur = TL.lines.find(l => t >= l.start - 0.05 && t < l.end + 0.3);
  if (cur && !(TL.speakers[cur.speaker] && TL.speakers[cur.speaker].texto)) {
    let c = cur.chunks[0];
    for (const x of cur.chunks) if (t >= x.s - 0.05) c = x;
    const dlg = cur.speaker !== "NARRATEUR";
    cap.className = dlg ? "dlg" : "";
    cap.innerHTML = c.ws.map((w, j) => j === c.red ? `<span class="r">${w.w}</span>` : w.w).join(" ");
    const pop = ease(ramp(t, c.s - 0.05, c.s + 0.08));
    cap.style.opacity = 1; cap.style.transform = `scale(${0.88 + 0.12 * pop})`;
  } else cap.style.opacity = 0;

  // écran final : flèches sur les deux options + COMMENTE
  const la = ramp(t, choix + 0.2, choix + 0.5), lb = ramp(t, choix + 1.1, choix + 1.4);
  if (cam === camera && pl === TL.plans[TL.plans.length - 1]) {
    const [lx, ly] = toScreen(TL.choix.ancre_gauche || [-2.85, 1.3, 1.675], camera), [rx, ry] = toScreen(TL.choix.ancre_droite || [1.4, 2.0, -3.0], camera);
    const lw = ui("labl").offsetWidth, rw = ui("labr").offsetWidth, cx = (x, w) => Math.min(W - 150 - w, Math.max(40, x));
    Object.assign(ui("labl").style, { left: `${cx(lx + 20, lw)}px`, top: `${ly - 50}px`, opacity: lb });
    Object.assign(ui("labr").style, { left: `${cx(rx - rw / 2, rw)}px`, top: `${ry - 120}px`, opacity: la });
  } else { ui("labl").style.opacity = 0; ui("labr").style.opacity = 0; }
  const fin = TL.lines[TL.lines.length - 1].end;
  ui("comment").style.opacity = ramp(t, fin + 0.1, fin + 0.4);
  ui("comment").style.transform = `scale(${1 + 0.05 * Math.sin(t * 7)})`;
  ui("flash").style.opacity = t >= sting ? 0.45 * Math.exp(-(t - sting) * 6) : 0;
};
window.ready = true;
</script>
</body>
</html>
