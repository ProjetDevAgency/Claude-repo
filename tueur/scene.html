}
box(0.3, 0.32, 0.3, 0x8a5a3c, 2.55, 0.16, -2.5); const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), mat(0x3f7a4a, { flatShading: true }));
leaf.position.set(2.55, 0.75, -2.5); leaf.castShadow = true; scene.add(leaf);
const frame = box(0.6, 0.45, 0.03, 0xe0d6c2, 0.2, 1.95, BZ + 0.1); box(0.5, 0.35, 0.01, 0x7a8fb0, 0.2, 1.95, BZ + 0.12);

// ---------- couloir (vu seulement par le judas) ----------
const hall = new THREE.Group(); hall.visible = false; scene.add(hall);
box(9, 0.05, 2.4, 0x6b5e52, 1.4, 0, -4.3, hall); box(9, 0.05, 2.4, 0x2a2a30, 1.4, 2.7, -4.3, hall);
box(9, 2.7, 0.1, 0x8a7d66, 1.4, 1.35, -5.5, hall);
for (const x of [-1.6, 1.4, 4.4]) { box(0.95, 2.1, 0.06, 0x5b3d2c, x, 1.05, -5.44, hall); box(0.05, 0.05, 0.06, 0xd9b45a, x + 0.36, 1.05, -5.4, hall); }
box(0.8, 0.02, 0.5, 0x3a2a22, 1.4, 0.03, -5.1, hall); box(0.3, 0.08, 0.02, 0xc8c8c8, 1.4, 1.75, -5.4, hall);
for (const x of [-3, 0, 3, 6]) box(0.5, 0.05, 0.5, 0xf0e6d0, x, 2.66, -4.3, hall, { emissive: 0x403020 });
box(9, 0.12, 0.04, 0x3a3230, 1.4, 0.06, -5.44, hall);
const hallLamp = new THREE.PointLight(0xffc98a, 6, 7, 1.5); hallLamp.position.set(1.4, 2.4, -4.3); hall.add(hallLamp);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff0d0 })); bulb.position.copy(hallLamp.position); hall.add(bulb);
const peepCam = new THREE.PerspectiveCamera(100, W / H, 0.05, 30);

// ---------- éclairage ----------
scene.add(new THREE.HemisphereLight(0x5a6ea8, 0x1a1420, 0.9));
const moon = new THREE.DirectionalLight(0x9db4ff, 2.6);
moon.position.set(-3.6, 5.5, -8); moon.target.position.set(-0.8, 0, 0.5); scene.add(moon.target);
moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 25 }); moon.shadow.bias = -0.0008;
scene.add(moon);
const fill = new THREE.DirectionalLight(0x6070a0, 0.35); fill.position.set(6, 6, 6); scene.add(fill);

// ---------- timeline ----------
let TL;
const L = id => TL.lines.find(l => l.id === id);
const ui = id => document.getElementById(id);

// plans de caméra : [début, fin, position départ, position fin, cible départ, cible fin, fov]
function shots() {
  const j = L("judas"), o = L("ombre"), t = L("tel"), m = L("message"), c = L("choix");
  const peepAt = j.start + 1.55;
  return [
    [0, j.start, [5.0, 5.6, 6.0], [4.0, 4.4, 4.8], [0.3, 0.8, -0.6], [0.5, 0.9, -0.9], 40],
    [j.start, peepAt, [3.6, 2.4, 1.6], [2.9, 2.1, -0.2], [0.9, 1.1, -1.4], [1.3, 1.3, -2.6], 42],
    [peepAt, o.start, "peep"],
    [o.start, t.start - 0.3, [2.2, 1.15, -0.9], [1.95, 0.9, -1.45], [1.35, 0.25, -2.95], [1.4, 0.15, -2.95], 46],
    [t.start - 0.3, m.end + 0.1, [0.55, 1.25, 1.25], [0.55, 0.85, 0.98], [0.55, 0.43, 0.7], [0.55, 0.43, 0.69], 34],
    [m.end + 0.1, c.start, [3.9, 1.75, -0.9], [3.3, 1.6, -1.0], [-1.6, 1.1, -1.7], [-2.2, 1.25, -1.6], 44],
    [c.start, TL.duration + 1, [5.6, 6.6, 6.8], [5.2, 6.2, 6.3], [-0.4, 0.8, -0.6], [-0.4, 0.8, -0.6], 42],
  ];
}
let SHOTS;

function heroAt(t) {
  const j = L("judas");
  const a = new THREE.Vector3(0.6, 0, 0.0), b = new THREE.Vector3(1.4, 0, -2.45);
  const w0 = j.start - 0.2, w1 = j.start + 1.4;
  const k = ease(ramp(t, w0, w1));
  hero.position.lerpVectors(a, b, k);
  hero.rotation.y = lerp(Math.atan2(b.x - a.x, b.z - a.z), Math.PI, ease(ramp(t, w1 - 0.3, w1 + 0.3)));
  const back = ease(ramp(t, w1 + 1.0, L("ombre").start + 0.2));
  hero.position.x = lerp(hero.position.x, 0.75, back); hero.position.z = lerp(hero.position.z, -1.85, back);
  const walking = t > w0 && t < w1 ? Math.sin(Math.PI * ramp(t, w0, w1)) ** .4 : 0;
  pose(hero, (t - w0) * 10, walking);
  hero.position.y = walking * Math.abs(Math.sin((t - w0) * 10)) * 0.03;
  // tête qui se penche vers le bas pendant l'ombre, puis légèrement vers le salon
  const o = L("ombre"), m = L("message");
  hero.userData.head.rotation.x = 0.35 * ease(ramp(t, o.start, o.start + 0.6)) - 0.35 * ease(ramp(t, m.start, m.start + 0.8));
  hero.userData.head.rotation.y = 0.5 * ease(ramp(t, m.end, m.end + 1.2));
}

window.setup = (timeline) => {
  TL = timeline; SHOTS = shots();
  ui("epi").textContent = TL.hud.episode; ui("place").textContent = TL.hud.place;
  ui("ca").querySelector(".l").textContent = TL.choice.a; ui("cb").querySelector(".l").textContent = TL.choice.b;
};

function clock(t) {
  const [h, m, s] = TL.hud.clock_start.split(":").map(Number);
  const tot = h * 3600 + m * 60 + s + Math.floor(t);
  const p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(tot / 3600))}:${p(Math.floor(tot / 60) % 60)}:${p(tot % 60)}`;
}

window.renderAt = (t) => {
  const j = L("judas"), o = L("ombre"), te = L("tel"), m = L("message"), c = L("choix"), cta = L("cta");

  // -- porte qui tremble aux coups
  let knock = 0;
  for (const k of TL.events.knock) knock += Math.exp(-Math.max(0, t - k) * 18) * (t >= k ? 1 : 0);
  doorPivot.rotation.y = -0.012 * knock * Math.sin(t * 90);

  // -- ombre sous la porte : passe de gauche à droite puis s'arrête au centre
  const sx = lerp(-0.25, 0.5, ease(ramp(t, o.start + 0.2, o.start + 2.4)));
  drawGap(0, 0);
  const pres = clamp(ramp(t, o.start, o.start + 0.3));
  feet.forEach((f, i) => { f.position.x = 0.92 + (sx + 0.08) * 0.96 + (i ? 0.13 : -0.13); f.material.opacity = 0.92 * pres; f.visible = f.position.x > 0.85 && f.position.x < 1.95; });
  gapLight.intensity = 0.7 - 0.35 * clamp(ramp(t, o.start + 1.4, o.start + 2.4)); gapLight.position.x = 1.4 - 0.4 * clamp(ramp(t, o.start, o.start + 2.4));

  // -- téléphone
  const buzzing = TL.events.buzz.some(b => t > b && t < b + 1.1);
  const on = t > TL.events.buzz[0];
  phone.position.x = 0.55 + (buzzing ? Math.sin(t * 160) * 0.004 : 0);
  phone.rotation.y = (buzzing ? Math.sin(t * 120) * 0.04 : 0);
  drawPhone(on ? (t > m.start ? 2 : 1) : 0, clamp(ramp(t, TL.events.buzz[0], TL.events.buzz[0] + 0.3)));
  phoneLight.intensity = on ? 0.35 : 0;

  // -- placard qui s'ouvre, yeux qui apparaissent
  const creak = TL.events.creak[0];
  wdHinge.rotation.y = -0.85 * ease(ramp(t, creak, creak + 1.1));
  eyes.forEach(e => e.material.opacity = ramp(t, creak + 0.7, creak + 1.0));

  // -- couloir : lampe qui grésille
  hallLamp.intensity = 6 * (Math.sin(t * 37) > 0.93 ? 0.25 : 1);
  bulb.material.color.setScalar(hallLamp.intensity > 3 ? 1 : 0.35);

  heroAt(t);

  // -- caméra
  const sh = SHOTS.find(s => t >= s[0] && t < s[1]) || SHOTS[SHOTS.length - 1];
  let cam = camera;
  if (sh[2] === "peep") {
    hall.visible = true; door.visible = false; hero.visible = false;
    peepCam.position.set(1.4 + Math.sin(t * 2) * 0.03, 1.6, BZ - 0.13);
    peepCam.lookAt(1.4 + Math.sin(t * 0.9) * 0.35, 1.2, -5.5);
    cam = peepCam;
  } else {
    hall.visible = false; door.visible = true; hero.visible = true;
    const k = ease(ramp(t, sh[0], sh[1]));
    camera.fov = sh[6]; camera.updateProjectionMatrix();
    camera.position.set(...sh[2].map((v, i) => lerp(v, sh[3][i], k)));
    const tg = sh[4].map((v, i) => lerp(v, sh[5][i], k));
    // tremblement léger aux coups et au cri du placard
    const shake = knock * 0.03 + (t > creak ? 0.012 * Math.exp(-(t - creak) * 1.5) : 0);
    camera.position.x += Math.sin(t * 71) * shake; camera.position.y += Math.cos(t * 63) * shake;
    camera.lookAt(...tg);
  }
  ui("peep").style.opacity = sh[2] === "peep" ? 1 : 0;

  // -- choix : scène assombrie
  const ch = ramp(t, c.start - 0.1, c.start + 0.5);
  renderer.toneMappingExposure = 1.25 - 0.45 * ch;
  outline.render(scene, cam);

  // -- interface
  ui("clock").textContent = clock(t);
  ui("hud").style.opacity = 1 - ch;
  const cur = TL.lines.find(l => t >= l.start - 0.15 && t < l.end + 0.35 && l.id !== "choix" && l.id !== "cta");
  const sub = ui("sub");
  if (cur) {
    const a = ramp(t, cur.start - 0.15, cur.start + 0.1), z = 1 - ramp(t, cur.end + 0.15, cur.end + 0.35);
    sub.style.opacity = Math.min(a, z); sub.style.transform = `translateY(${(1 - a) * 16}px)`;
    sub.querySelector(".t").textContent = cur.text;
    const hT = cur.start + (cur.end - cur.start) * cur.text.length / (cur.text.length + cur.hi.length + 1);
    const h = sub.querySelector(".h"); h.textContent = cur.hi; h.style.display = cur.hi ? "block" : "none";
    const hk = ramp(t, hT - 0.1, hT + 0.15); h.style.opacity = hk; h.style.transform = `scale(${1.15 - 0.15 * hk})`;
  } else sub.style.opacity = 0;

  ui("choice").style.opacity = ch;
  const pa = ease(ramp(t, c.start, c.start + 0.35)), pb = ease(ramp(t, c.start + 1.3, c.start + 1.65));
  ui("ca").style.opacity = pa; ui("ca").style.transform = `scale(${0.85 + 0.15 * pa})`;
  ui("cb").style.opacity = pb; ui("cb").style.transform = `scale(${0.85 + 0.15 * pb})`;
  ui("vs").style.opacity = ramp(t, c.start + 0.9, c.start + 1.2);
  const pulse = 1 + 0.025 * Math.sin(t * 8) * ramp(t, cta.start, cta.start + 0.3);
  if (t > c.start + 1.7) { ui("ca").style.transform = `scale(${pulse})`; ui("cb").style.transform = `scale(${2 - pulse})`; }
  ui("bar").style.opacity = ramp(t, cta.start - 0.2, cta.start + 0.2);
  ui("bar").firstElementChild.style.width = `${100 * ramp(t, cta.start, TL.duration - 0.3)}%`;
  ui("cta").style.opacity = ramp(t, cta.start, cta.start + 0.3);
  ui("cta").innerHTML = `Écris <b>A</b> ou <b>B</b> en commentaire 👇<br><span style="opacity:.75;font-size:36px">La partie 2 suit vos votes</span>`;
  ui("flash").style.opacity = 0.5 * Math.exp(-Math.max(0, t - TL.events.sting[0]) * 6) * (t >= TL.events.sting[0] ? 1 : 0);
  ui("vign").style.opacity = 1;
};
window.ready = true;
</script>
</body>
