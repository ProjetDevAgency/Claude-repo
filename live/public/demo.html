<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Village en direct</title>
<style>
  @font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
  :root { --fond: #0e1220; }
  html, body { margin: 0; height: 100%; background: var(--fond); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; height: 100vh; width: calc(100vh * 9 / 16); max-width: 100vw; max-height: calc(100vw * 16 / 9); }
  #son { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 10px 18px; border: 0;
         border-radius: 999px; background: #ffce00; color: #16161c; font: 800 15px Montserrat, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<button id="son" hidden>🔇 Touche pour activer le son</button>
<script>window.VILLAGE_DEMO = true;</script>
<script type="module" src="village.js"></script>
</body>
</html>
